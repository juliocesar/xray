<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>xray — browser Tier 0 demo</title>
    <!--
      Zero-install front-end path: the relay serves its own client with its origin
      baked in. Start the relay (`npx xray`), then open this file in a browser.
      Works from file://, http://localhost, and (loopback is trusted) https too.
    -->
    <script src="http://127.0.0.1:7200/xray.js" data-xray-source="web"></script>
  </head>
  <body style="font-family: system-ui; max-width: 40rem; margin: 3rem auto">
    <h1>xray browser demo</h1>
    <p>
      Start the relay with <code>npx xray</code>, then click. In another terminal run
      <code>xray tail</code> to watch the events arrive.
    </p>
    <button id="create">order.created</button>
    <button id="fail">sync.failed</button>

    <script>
      // A shared trace id stitches this page's events to whatever your API/worker
      // emit for the same action.
      window.__XRAY_TRACE__ = 'demo_' + Math.random().toString(36).slice(2, 8)

      document.getElementById('create').addEventListener('click', () => {
        window.xray('order.created', { orderId: 'abc', at: Date.now() })
      })
      document.getElementById('fail').addEventListener('click', () => {
        window.xray('sync.failed', { reason: 'timeout' })
      })
    </script>
  </body>
</html>
